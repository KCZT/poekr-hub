<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d211c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Track buy-ins, cash-outs and who owes who at your home poker game.">
<meta name="mobile-web-app-capable" content="content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/brand/icon">
<link rel="apple-touch-icon" href="/brand/icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<title>Poker Hub</title>
</head>
<body>
  <div id="app">
    <header class="appbar" id="appbar" hidden>
      <button class="iconbtn" id="backBtn" hidden aria-label="Go back">‹</button>
      <h1 id="title">Poker Hub<span class="sub" id="subtitle"></span></h1>
      <button class="iconbtn" id="soundBtn" aria-label="Mute sounds" title="Sounds">🔊</button>
      <button class="iconbtn" id="headerAction" hidden></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" hidden aria-label="Sections"></nav>
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <div id="layer"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
